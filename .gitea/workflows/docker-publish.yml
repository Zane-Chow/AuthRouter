name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*.*'

env:
  # 请将此处替换为你的 Gitea 实例的域名（不带 https://）
  # 例如: git.zhouhaoze.com 或 gitea.yourdomain.com
  REGISTRY: git.zhouhaoze.com
  # 镜像名称，Docker 镜像名必须全部小写（原 github.repository 可能包含大写如 YiYi/SSO）
  IMAGE_NAME: yiyi/sso

jobs:
  build-and-push:
    runs-on: ubuntu-latest # 确保你的 Gitea Runner 支持 ubuntu-latest 标签
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # 由于 Gitea 自带的 Action Token 经常存在没有 Package 写入权限的问题，
          # 强烈建议使用 Personal Access Token (PAT) 存入仓库的 Secrets 中
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
