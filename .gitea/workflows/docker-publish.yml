name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*.*'

env:
  # 请将此处替换为你的 Gitea 实例的域名（不带 https://）
  # 例如: git.zhouhaoze.com 或 gitea.yourdomain.com
  REGISTRY: git.zhouhaoze.com
  # 镜像名称，Docker 镜像名必须全部小写（原 github.repository 可能包含大写如 YiYi/SSO）
  IMAGE_NAME: yiyi/sso

jobs:
  build-and-push:
    runs-on: ubuntu-latest # 确保你的 Gitea Runner 支持 ubuntu-latest 标签
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # 尝试硬编码全小写用户名（Docker Registry 往往对大小写极其敏感）
          username: yiyi
          # Gitea 原生推荐使用 GITEA_TOKEN，并带上 GITHUB_TOKEN 作为回退
          password: ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
