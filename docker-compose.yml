services:
  authrouter:
    build:
      context: .
    image: authrouter:local
    container_name: authrouter
    restart: unless-stopped
    ports:
      # Only bind to localhost — nginx reverse proxy handles external traffic
      - "127.0.0.1:${SSO_PORT:-3000}:${SSO_PORT:-3000}"
    volumes:
      # Always persists keys; also persists the database when using SQLite
      - sso-data:${DATA_DIR:-/app/data}
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${SSO_PORT:-3000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sso-data:
