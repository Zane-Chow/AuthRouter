# =====================================================
# Example Nginx Reverse Proxy for SSO Middleware
# =====================================================
# Add this to your nginx config or create a new site.
# Adjust SSL certificate paths to match your setup.
#
# If you use Mailcow's built-in nginx, you may need to
# add this as a separate server block in the nginx config
# or use a standalone nginx instance.

server {
    listen 80;
    server_name sso.zhouhaoze.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sso.zhouhaoze.com;

    # SSL certificates — adjust paths
    ssl_certificate     /etc/letsencrypt/live/sso.zhouhaoze.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sso.zhouhaoze.com/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket support (optional, for future use)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
